name: Build Windows Portable

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      build-type:
        description: Build type
        type: choice
        options: [Release, Debug]
        default: Release

permissions:
  contents: read

jobs:
  build:
    name: Build Windows (MinGW, Portable)
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    env:
      BUILD_TYPE: ${{ inputs.build-type || 'Release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: git
          pacboy: >-
            toolchain:p
            cmake:p
            extra-cmake-modules:p
            ninja:p
            qt6-base:p
            qt6-svg:p
            qt6-imageformats:p
            qt6-networkauth:p
            cmark:p
            qrencode:p
            tomlplusplus:p
            libarchive:p

      - name: Configure
        run: cmake --preset windows_mingw

      - name: Build
        run: cmake --build --preset windows_mingw --config "$BUILD_TYPE"

      - name: Install
        run: |
          cmake --install build --config "$BUILD_TYPE" --prefix install-portable
          cmake --install build --config "$BUILD_TYPE" --prefix install-portable --component portable

      - name: Add EyeMine instance
        shell: bash
        run: |
          INST=install-portable/instances/EyeMineV2
          mkdir -p "$INST/minecraft/mods"
          cp -r packaging/eyemine-instance/. "$INST/"

      - name: Get short SHA
        id: sha
        shell: bash
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: EyeMineV2-Launcher-${{ steps.sha.outputs.sha }}
          path: install-portable/**
